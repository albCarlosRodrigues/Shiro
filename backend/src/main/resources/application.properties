spring.application.name=squad-desktop-backend

# O serviço só escuta em loopback. A porta 0 pede uma porta livre ao sistema;
# o shell desktop descobre a porta real pelo arquivo de prontidão.
server.address=127.0.0.1
server.port=${SQUAD_PORT:0}

spring.threads.virtual.enabled=true
spring.main.banner-mode=off
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s
